name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Queue deploys instead of cancelling: a cancelled deploy can leave Pages
# serving a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # --strict fails on a broken internal link or a page missing from the nav,
      # which is what a pull request is meant to catch: one live site per
      # repository means there are no per-PR previews to eyeball.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
